plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

def keystorePropertiesFile = rootProject.file("keystore.properties")
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    compileSdk 36

    defaultConfig {
        applicationId "com.regula.backend.processing"
        minSdk 26
        targetSdk 36
        versionCode 1
        versionName "1.0"
    }
    
    signingConfigs {
        release {
            if (keystorePropertiesFile.exists()) {
                storeFile file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = "17"
    }

    viewBinding {
        enabled = true
    }
    namespace 'com.regula.backend.processing'
}

dependencies {

    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.appcompat:appcompat:1.4.2'
    implementation 'com.google.android.material:material:1.6.1'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'

    implementation 'com.regula.documentreader.core:fullrfid:8.3.+@aar'
    implementation 'com.google.zxing:core:3.5.2'
    implementation('com.regula.documentreader:api:8.3.+@aar') {
        transitive = true
    }

    // iProov SDK dependencies (match example-app)
    implementation 'com.iproov.sdk:iproov:10.4.0'
    implementation group: "com.iproov.android-api-client", name: "kotlin-fuel", version: "3.0.0"
    implementation group: "com.iproov.android-api-client", name: "kotlin-common", version: "3.0.0"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-core:1.5.1"
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.5.1'
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-jdk8:1.2.1"
    implementation "androidx.lifecycle:lifecycle-runtime-ktx:2.4.1"
}